name: PR autofill

# Auto-populate PR sidebar fields that templates can't set (because
# pull_request_template.md is plain markdown without YAML front matter):
#
#   - Assignees   → the PR author (you opened it, you own it until it merges)
#   - Milestone   → the nearest active milestone with a future due date
#
# Reviewers stays empty for self-authored PRs — GitHub doesn't allow you
# to review your own PR (platform rule, not a workflow limitation).

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  autofill:
    name: Assign author + set milestone
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --add-assignee "${{ github.event.pull_request.user.login }}"

      - name: Set nearest open milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Pick the open milestone with the earliest future due_on. If
          # no milestones have a due date in the future, skip (don't
          # arbitrarily pick the next-due past one — that'd be wrong).
          MILESTONE=$(gh api "repos/$REPO/milestones?state=open&sort=due_on&direction=asc&per_page=20" \
            --jq '[.[] | select(.due_on != null) | select((.due_on | fromdateiso8601) > now)] | .[0].title // ""')
          if [[ -z "$MILESTONE" ]]; then
            echo "No open milestone with a future due date — skipping."
            exit 0
          fi
          echo "Setting milestone: $MILESTONE"
          gh issue edit "$PR" --repo "$REPO" --milestone "$MILESTONE"
