name: Automation

# Consolidated repo automation for new/reopened issues & PRs, in ONE job to
# minimize billed Actions minutes. GitHub bills each JOB rounded up to a full
# minute, so three ~6s workflows (triage + auto-label + pr-autofill) cost 3
# minutes per PR event and 2 per issue event; folding them into a single job
# costs 1. Replaces triage.yml + auto-label.yml + pr-autofill.yml.
#
# Each step is guarded with `if: ${{ !cancelled() && ... }}` so it still runs
# even if an earlier step failed — preserving the independence of the three
# original workflows while sharing a single runner spin-up. A failure in any
# step still surfaces as a failed job.

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  automate:
    name: Triage, label & autofill
    runs-on: ubuntu-latest
    steps:
      # ── Add to Philip's Engineering tracker Project + default Priority=P2 ──
      # Needs a CLASSIC PAT (PROJECT_TOKEN) — GITHUB_TOKEN can't write
      # user-scoped Projects v2 (that permission only exists for org Projects).
      # Opt-in per repo via the PROJECT_URL variable; the step self-skips until
      # it is set. IDs are hardcoded for Philinzag/projects/1:
      #   Project PVT_kwHOAVFqzM4BZADN
      #   Priority field PVTSSF_lAHOAVFqzM4BZADNzhUB2SY · P2 option fe03df04
      # Look up with: gh project field-list 1 --owner Philinzag
      - name: Add to Project
        id: add
        if: ${{ !cancelled() && vars.PROJECT_URL != '' }}
        uses: actions/add-to-project@v2
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}

      - name: Set Priority = P2 (default)
        if: ${{ !cancelled() && vars.PROJECT_URL != '' && steps.add.outputs.itemId != '' }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ITEM_ID: ${{ steps.add.outputs.itemId }}
        run: |
          gh api graphql \
            -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId:    $item
                  fieldId:   $field
                  value:     { singleSelectOptionId: $value }
                }) {
                  projectV2Item { id }
                }
              }
            ' \
            -f project="PVT_kwHOAVFqzM4BZADN" \
            -f item="$ITEM_ID" \
            -f field="PVTSSF_lAHOAVFqzM4BZADNzhUB2SY" \
            -f value="fe03df04"

      # ── Label from conventional-commit title prefix (issues + PRs) ──
      # Covers CLI/agent-opened items that bypass the template's `labels:`
      # front matter (which only applies via the web form UI).
      - name: Apply label from title prefix
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
        run: |
          shopt -s nocasematch
          LABEL=""
          case "$TITLE" in
            bug:*|bug\(*|fix:*|fix\(*)
              LABEL="bug" ;;
            feat:*|feat\(*|feature:*|feature\(*)
              LABEL="enhancement" ;;
            chore:*|chore\(*|docs:*|docs\(*|refactor:*|refactor\(*|test:*|test\(*|style:*|style\(*|ci:*|ci\(*|build:*|build\(*|perf:*|perf\(*)
              LABEL="chore" ;;
          esac
          shopt -u nocasematch
          if [[ -z "$LABEL" ]]; then
            echo "Title '$TITLE' has no conventional-commit prefix — skipping."
            exit 0
          fi
          echo "Applying label '$LABEL' (matched on title prefix)"
          # /issues/N/labels works for both issues and PRs (GitHub stores PRs
          # as a special kind of issue).
          gh api --method POST "repos/${{ github.repository }}/issues/$NUM/labels" \
            -f "labels[]=$LABEL"

      # ── PR-only: assign the author + nearest future-due milestone ──
      # Closes the PR-sidebar gap that pull_request_template.md (plain markdown,
      # no front matter) can't fill. Reviewers stays empty — GitHub won't let
      # you review your own PR.
      - name: Assign PR author
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --add-assignee "${{ github.event.pull_request.user.login }}"

      - name: Set nearest open milestone
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Earliest OPEN milestone whose due date is still in the future.
          # Don't fall back to a past-due one — that'd be wrong.
          MILESTONE=$(gh api "repos/$REPO/milestones?state=open&sort=due_on&direction=asc&per_page=20" \
            --jq '[.[] | select(.due_on != null) | select((.due_on | fromdateiso8601) > now)] | .[0].title // ""')
          if [[ -z "$MILESTONE" ]]; then
            echo "No open milestone with a future due date — skipping."
            exit 0
          fi
          echo "Setting milestone: $MILESTONE"
          gh issue edit "$PR" --repo "$REPO" --milestone "$MILESTONE"
