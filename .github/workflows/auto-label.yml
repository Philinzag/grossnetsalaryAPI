name: Auto-label

# Apply a label to new issues/PRs based on their title prefix.
# Conventional-commit prefixes (`bug:`, `feat:`, `chore:`, etc.) map cleanly
# to our standard labels (`bug`, `enhancement`, `chore`). Useful for
# CLI-opened issues/PRs that bypass the template's `labels:` front matter
# (which only applies via the web form UI).

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-by-title:
    name: Apply label from title prefix
    runs-on: ubuntu-latest
    steps:
      - name: Detect prefix + apply label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
        run: |
          # Normalize: lowercase prefix, allow trailing space, parenthesized scope.
          # Examples that match:
          #   bug: something broken          → bug
          #   bug(api): something broken     → bug
          #   feat: new thing                → enhancement
          #   chore(deps): bump              → chore
          shopt -s nocasematch
          LABEL=""
          case "$TITLE" in
            bug:*|bug\(*|fix:*|fix\(*)
              LABEL="bug" ;;
            feat:*|feat\(*|feature:*|feature\(*)
              LABEL="enhancement" ;;
            chore:*|chore\(*|docs:*|docs\(*|refactor:*|refactor\(*|test:*|test\(*|style:*|style\(*|ci:*|ci\(*|build:*|build\(*|perf:*|perf\(*)
              LABEL="chore" ;;
          esac
          shopt -u nocasematch

          if [[ -z "$LABEL" ]]; then
            echo "Title '$TITLE' has no conventional-commit prefix — skipping."
            exit 0
          fi

          echo "Applying label '$LABEL' (matched on title prefix)"
          # /issues/N/labels endpoint works for both issues and PRs
          # (GitHub stores PRs as a special kind of issue).
          gh api --method POST "repos/${{ github.repository }}/issues/$NUM/labels" \
            -f "labels[]=$LABEL"
