name: Triage

# Auto-add new issues + PRs to Philip's Engineering tracker Project, then
# set Priority to P2 (soon) as the default. Priority can be bumped to
# P0/P1 or dropped to P3 manually from the Project board.
#
# Per-repo setup (one-time):
#   1. Set repo variable `PROJECT_URL` to the Project URL
#      (Settings → Secrets and variables → Actions → Variables → New repository variable)
#      e.g. https://github.com/users/Philinzag/projects/1
#   2. Set repo secret `PROJECT_TOKEN` to a CLASSIC PAT with `repo` + `project`
#      scopes (https://github.com/settings/tokens/new). Fine-grained PATs do
#      NOT work — they have no permission scope for user-owned Projects v2.
#   3. Both must be set — the `if:` gate skips the job otherwise so the
#      workflow is non-blocking until configured.
#
# Why a PAT and not GITHUB_TOKEN?
#   GitHub's built-in GITHUB_TOKEN can't write to user-scoped Projects v2.
#   The `projects: write` workflow permission only exists for org Projects.
#
# Project + Priority IDs (hardcoded for Philinzag/projects/1):
#   Project node ID:        PVT_kwHOAVFqzM4BZADN
#   Priority field ID:      PVTSSF_lAHOAVFqzM4BZADNzhUB2SY
#   P2 — soon option ID:    fe03df04
# Look these up with:
#   gh project field-list 1 --owner Philinzag --format json

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  add-to-project:
    name: Add to Engineering tracker
    runs-on: ubuntu-latest
    # Per-repo opt-in: only runs once PROJECT_URL is configured.
    if: ${{ vars.PROJECT_URL != '' }}
    steps:
      - name: Add to Project
        id: add
        uses: actions/add-to-project@v2
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}

      - name: Set Priority = P2 (default)
        # Only run if the previous step actually added the item.
        if: ${{ steps.add.outputs.itemId != '' }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ITEM_ID: ${{ steps.add.outputs.itemId }}
        run: |
          gh api graphql \
            -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId:    $item
                  fieldId:   $field
                  value:     { singleSelectOptionId: $value }
                }) {
                  projectV2Item { id }
                }
              }
            ' \
            -f project="PVT_kwHOAVFqzM4BZADN" \
            -f item="$ITEM_ID" \
            -f field="PVTSSF_lAHOAVFqzM4BZADNzhUB2SY" \
            -f value="fe03df04"
